<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Una Galaxia de Amor para Ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
:root {
  --pink: #ff4fa3;
  --pink-soft: #ffb3d6;
  --wine: #2a0715;
  --ink: #fff0f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050005; color: var(--ink); font-family: "Inter", system-ui, sans-serif; }
#scene { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
#scene.dragging { cursor: grabbing; }
#scene.pointer { cursor: pointer; }

/* ---------- Candado inicial ---------- */
.lock-screen {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
  background: radial-gradient(ellipse at 50% 25%, #d87eaa, #a6477a 65%, #64264f);
  z-index: 30; transition: opacity .55s ease, visibility 0s linear .55s;
}
.lock-screen.unlocked { opacity: 0; visibility: hidden; pointer-events: none; }
.lock-card {
  width: min(340px, 92vw); padding: 34px 26px 26px; text-align: center;
  border: 1px solid rgba(255,240,248,.5); border-radius: 22px;
  background: linear-gradient(160deg, rgba(255,226,240,.3), rgba(96,26,69,.38));
  box-shadow: 0 24px 70px rgba(48,8,36,.4), 0 0 40px rgba(255,220,238,.15) inset;
  backdrop-filter: blur(12px); animation: cardIn 1s cubic-bezier(.2,.8,.2,1) both;
}
.lock-icon {
  position: relative; width: 64px; height: 48px; margin: 18px auto 24px;
  border-radius: 11px; background: linear-gradient(150deg, #ffbad8, #e879ad);
  box-shadow: 0 8px 22px rgba(71,12,48,.25);
}
.lock-icon::before {
  content: ""; position: absolute; left: 17px; top: -30px; width: 30px; height: 34px;
  border: 6px solid #ffd4e6; border-bottom: 0; border-radius: 20px 20px 0 0;
}
.lock-icon::after {
  content: ""; position: absolute; left: 29px; top: 15px; width: 6px; height: 16px;
  border-radius: 5px; background: #8d315f; box-shadow: 0 -4px 0 2px #8d315f;
}
.lock-title {
  margin-bottom: 8px; font: 700 25px "Playfair Display", Georgia, serif;
  color: #fff3f8; text-shadow: 0 2px 12px rgba(70,13,48,.35);
}
.lock-copy { margin-bottom: 20px; color: #ffe4ef; font-size: 13px; line-height: 1.5; }
.lock-fields { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 10px; margin-bottom: 18px; }
.lock-fields label { display: grid; gap: 6px; color: #ffe5f0; font-size: 10px; letter-spacing: .12em; }
.lock-fields input {
  width: 100%; min-width: 0; padding: 12px 6px; border: 1px solid rgba(255,235,245,.6);
  border-radius: 9px; outline: none; background: rgba(86,24,61,.28); color: #fff;
  text-align: center; font: 600 18px "Inter", sans-serif;
}
.lock-fields input:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,230,242,.2); }
.lock-fields input::placeholder { color: rgba(255,235,245,.65); }
.lock-submit {
  width: 100%; padding: 13px 18px; border: 0; border-radius: 999px;
  background: linear-gradient(90deg, #ffe1ef, #ffadd1); color: #672345;
  cursor: pointer; font: 600 11px "Inter", sans-serif; letter-spacing: .16em;
  box-shadow: 0 8px 24px rgba(70,13,48,.25); transition: transform .2s;
}
.lock-submit:hover { transform: scale(1.03); }
.lock-error { margin-top: 14px; color: #fff; font-size: 12px; }
.lock-error[hidden] { display: none; }

/* ---------- Intro ---------- */
.intro {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
  background: radial-gradient(ellipse at 70% 30%, #4a1530 0%, #1a0510 45%, #060006 100%);
  transition: opacity 1.1s ease, visibility 1.1s;
  z-index: 10;
}
.intro.hide { opacity: 0; visibility: hidden; pointer-events: none; }
.intro.hide .intro-card { transform: scale(1.25); opacity: 0; }
.intro::before, .intro::after {            /* destellos de fondo */
  content: ""; position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,79,163,.22), transparent 65%);
  animation: drift 9s ease-in-out infinite alternate; pointer-events: none;
}
.intro::before { top: -20vmax; right: -20vmax; }
.intro::after  { bottom: -25vmax; left: -25vmax; animation-delay: -4s; }
@keyframes drift { to { transform: translate(-6vmax, 5vmax) scale(1.15); } }

.intro-card {
  position: relative; width: min(380px, 92vw); padding: 44px 28px 36px; text-align: center;
  border-radius: 26px; border: 1px solid rgba(255,160,205,.22);
  background: linear-gradient(160deg, rgba(90,20,50,.55), rgba(25,4,16,.75));
  box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(255,79,163,.18) inset;
  backdrop-filter: blur(10px);
  transition: transform 1.1s cubic-bezier(.2,.8,.2,1), opacity 1s;
  animation: cardIn 1.2s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(40px) scale(.92); } }
.intro-card h1 {
  font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: clamp(30px, 8vw, 40px); line-height: 1.15;
  text-shadow: 0 0 22px rgba(255,160,205,.7), 0 0 4px #fff;
  animation: glow 3s ease-in-out infinite alternate;
}
@keyframes glow { to { text-shadow: 0 0 34px rgba(255,100,180,.95), 0 0 6px #fff; } }
.intro-img {
  width: 128px; height: 128px; object-fit: contain; margin: 26px auto 22px; display: block;
  border-radius: 50%; background: #fff; padding: 6px;
  box-shadow: 0 0 0 3px rgba(255,120,190,.6), 0 0 36px rgba(255,79,163,.55);
  animation: floaty 3.4s ease-in-out infinite;
}
@keyframes floaty { 50% { transform: translateY(-10px) rotate(-3deg); } }
.intro-sub { font-size: 12px; letter-spacing: .22em; color: var(--pink-soft); margin-bottom: 26px; }

.btn-main {
  position: relative; border: 0; cursor: pointer; padding: 15px 22px; width: 100%;
  font: 600 12px "Inter", sans-serif; letter-spacing: .16em; color: #3a0620;
  border-radius: 999px; background: linear-gradient(90deg, #ff9ec7, #ff5fa8);
  box-shadow: 0 8px 30px rgba(255,79,163,.45);
  animation: pulse 2.2s ease-in-out infinite; transition: transform .2s;
}
.btn-main:hover { transform: scale(1.04); }
.btn-main:active { transform: scale(.97); }
@keyframes pulse { 50% { box-shadow: 0 8px 44px rgba(255,79,163,.85); } }

/* ---------- Pista ---------- */
.hint {
  position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); z-index: 5;
  padding: 9px 16px; font-size: 12px; text-align: center; color: var(--pink-soft); max-width: 92vw;
  background: rgba(30,4,18,.55); border: 1px solid rgba(255,160,205,.2); border-radius: 999px; backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity 1s;
}
.hint.show { opacity: 1; animation: hintOut 1s 7s forwards; }
@keyframes hintOut { to { opacity: 0; } }

/* ---------- Reproductor de música ---------- */
.music-player {
  position: fixed; left: 50%; bottom: 18px; z-index: 12;
  display: grid; grid-template-columns: 38px auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
  width: min(500px, calc(100vw - 28px)); padding: 10px 14px;
  border: 1px solid rgba(255,160,205,.28); border-radius: 18px;
  background: rgba(35,7,23,.88); box-shadow: 0 10px 35px rgba(0,0,0,.4);
  backdrop-filter: blur(10px); opacity: 0; visibility: hidden; pointer-events: none;
  transform: translate(-50%, 12px); transition: opacity .3s, visibility .3s, transform .3s;
}
.music-player.show {
  opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, 0);
}
.music-toggle {
  width: 38px; height: 38px; border: 0; border-radius: 50%;
  background: linear-gradient(135deg, #ff9ec7, #ff5fa8); color: #3a0620;
  cursor: pointer; font: 700 15px "Inter", sans-serif;
}
.music-toggle:focus-visible, .music-seek:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.music-time { color: #ffe4ef; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.music-seek { width: 100%; accent-color: var(--pink); cursor: pointer; }
.music-seek:disabled { cursor: wait; opacity: .55; }

/* ---------- Tarjeta emergente ---------- */
.modal {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 20;
  background: rgba(5,0,8,.55); backdrop-filter: blur(4px);
  opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s;
}
.modal.open { opacity: 1; visibility: visible; }
.modal-card {
  position: relative; width: min(340px, 92vw); padding: 22px 22px 24px; text-align: center;
  border-radius: 22px; border: 1px solid rgba(255,160,205,.28);
  background: linear-gradient(170deg, #3a0c22, #170410);
  box-shadow: 0 30px 80px #000, 0 0 50px rgba(255,79,163,.3);
  transform: translateY(40px) scale(.7) rotate(-4deg); transition: transform .5s cubic-bezier(.2,1.2,.3,1);
}
.modal.open .modal-card { transform: none; }
.modal-img-wrap {
  height: 190px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 18px; overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #5a1a38, #1a0510);
}
.modal-img-wrap img { width: 180px; height: 180px; object-fit: contain; background: #fff; border-radius: 14px; animation: floaty 3.2s ease-in-out infinite; }
.modal-card h2 { font-family: "Playfair Display", Georgia, serif; font-size: 22px; margin-bottom: 8px; text-shadow: 0 0 14px rgba(255,120,190,.6); }
.modal-card p { font-size: 12.5px; line-height: 1.6; color: #f3c4da; margin-bottom: 18px; }
.modal-heart {
  position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 30px; height: 30px; line-height: 30px;
  border-radius: 50%; background: #ff4fa3; color: #fff; font-size: 16px; box-shadow: 0 0 20px #ff4fa3;
  animation: beat 1.1s infinite;
}
@keyframes beat { 0%, 100% { transform: translateX(-50%) scale(1); } 20% { transform: translateX(-50%) scale(1.25); } 40% { transform: translateX(-50%) scale(1); } }
.btn-small {
  cursor: pointer; background: transparent; color: var(--pink-soft); font: 600 10px "Inter", sans-serif; letter-spacing: .2em;
  padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(255,160,205,.5); transition: .2s;
}
.btn-small:hover { background: rgba(255,79,163,.25); color: #fff; }

</style>
</head>
<body>
  <!-- Escena (canvas 2D con proyección 3D propia, sin librerías) -->
  <canvas id="scene"></canvas>
  <audio id="backgroundMusic" src="cancion.mp3/cancion.mp3" preload="none"></audio>

  <section id="lockScreen" class="lock-screen" aria-labelledby="lockTitle">
    <form id="lockForm" class="lock-card">
      <div class="lock-icon" aria-hidden="true"></div>
      <h1 id="lockTitle" class="lock-title">Un detalle para ti</h1>
      <p class="lock-copy">Ingresa la fecha especial para continuar</p>
      <div class="lock-fields">
        <label>DÍA<input id="lockDay" type="text" inputmode="numeric" maxlength="2" placeholder="DD" autocomplete="off" required></label>
        <label>MES<input id="lockMonth" type="text" inputmode="numeric" maxlength="2" placeholder="MM" autocomplete="off" required></label>
        <label>AÑO<input id="lockYear" type="text" inputmode="numeric" maxlength="4" placeholder="AAAA" autocomplete="off" required></label>
      </div>
      <button class="lock-submit" type="submit">DESBLOQUEAR</button>
      <p id="lockError" class="lock-error" role="alert" hidden>La fecha no es correcta. Inténtalo otra vez.</p>
    </form>
  </section>

  <!-- Pantalla de bienvenida -->
  <section id="intro" class="intro">
    <div class="intro-card">
      <h1 id="introTitle"></h1>
      <img id="introImg" class="intro-img" alt="">
      <p id="introSub" class="intro-sub"></p>
      <button id="enterBtn" class="btn-main"></button>
    </div>
  </section>

  <!-- Pista de uso -->
  <div id="hint" class="hint"></div>
  <div id="musicPlayer" class="music-player" role="group" aria-label="Reproductor de música">
    <button id="musicToggle" class="music-toggle" type="button" aria-label="Reproducir canción">▶</button>
    <span id="musicCurrent" class="music-time">0:00</span>
    <input id="musicSeek" class="music-seek" type="range" min="0" max="0" value="0" step="1" aria-label="Posición de la canción" disabled>
    <span id="musicDuration" class="music-time">--:--</span>
  </div>

  <!-- Tarjeta emergente de cada personaje -->
  <section id="modal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <span class="modal-heart">♥</span>
      <div class="modal-img-wrap"><img id="modalImg" alt=""></div>
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <button id="modalClose" class="btn-small">VOLVER ♥</button>
    </div>
  </section>

  <script>
// =====================================================
//  GALAXIA DE AMOR — motor 3D en Canvas 2D (sin librerías)
//  Secciones: 
// 1) Utilidades 
// 2) Cámara  
// 3) Partículas
// 4) Elementos flotantes  
// 5) Render  
// 6) Interacción  
// 7) UI
// =====================================================
(() => {
  "use strict";
  const CFG = window.CONFIG;
  const TAU = Math.PI * 2;

  // ---------- 1) Utilidades ----------
  const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const randn = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const lerp = (a, b, t) => a + (b - a) * t;

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1, F = 600;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    F = Math.min(W * 1.25, H * 1.0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 2) Cámara ----------
  const cam = { yaw: 0.3, pitch: 0.42, dist: 80, tYaw: 0.3, tPitch: 0.42, tDist: 80 };
  if (W < H) cam.dist = cam.tDist = 104;           // pantallas verticales: alejar un poco
  const P = { x: 0, y: 0, d: 1, s: 1 };           // resultado de proyección (reutilizable)

  function project(x, y, z, out = P) {
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
    out.d = cam.dist - z2;                         // profundidad (mayor = más lejos)
    out.s = out.d > 1 ? F / out.d : 0;             // escala de perspectiva
    out.x = W / 2 + x1 * out.s;
    out.y = H * 0.56 - y2 * out.s;
    return out;
  }

  // ---------- 3) Partículas ----------
  // 3a) Galaxia espiral
  const R = 42, ARMS = 3, NG = 15000;
  const g = {
    r: new Float32Array(NG), a0: new Float32Array(NG), y: new Float32Array(NG),
    w: new Float32Array(NG), sz: new Float32Array(NG), col: new Array(NG),
    dx: new Float32Array(NG), dy: new Float32Array(NG), dz: new Float32Array(NG),
    delay: new Float32Array(NG)
  };
  for (let i = 0; i < NG; i++) {
    const r = 3 + R * Math.pow(Math.random(), 1.5);
    const k = r / R;
    g.r[i] = r;
    g.a0[i] = (i % ARMS) * TAU / ARMS + r * 0.17 + randn() * (0.2 + k * 0.6);
    g.y[i] = randn() * 0.9 * (1 - k * 0.7);
    g.w[i] = 0.55 / (1 + r * 0.07);                // rotación diferencial
    g.sz[i] = rand(0.8, 2.1) * (1.3 - k * 0.5);
    // color: núcleo blanco-rosa -> magenta -> violeta tenue
    const c = k < 0.18 ? [255, 225, 240] : k < 0.5 ? [255, 70 + k * 80, 170] : [200 - k * 60, 50, 190];
    g.col[i] = `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${(0.9 - k * 0.5).toFixed(2)})`;
    // dirección de la explosión inicial
    const u = rand(TAU), v = rand(-1, 1), q = Math.sqrt(1 - v * v);
    g.dx[i] = q * Math.cos(u); g.dy[i] = v; g.dz[i] = q * Math.sin(u);
    g.delay[i] = rand(0, 0.18);
  }

  // 3b) Corazón de partículas (curva paramétrica clásica)
  const NH = 3800;
  const hrt = { x: new Float32Array(NH), y: new Float32Array(NH), z: new Float32Array(NH), edge: new Uint8Array(NH), ph: new Float32Array(NH) };
  const HS = 0.62, HY = 20;                         // escala y altura
  for (let i = 0; i < NH; i++) {
    const t = rand(TAU);
    let hx = 16 * Math.pow(Math.sin(t), 3);
    let hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    const edge = Math.random() < 0.4;
    const s = edge ? 1 + randn() * 0.03 : Math.sqrt(Math.random()) * 0.94;
    hrt.x[i] = hx * s * HS; hrt.y[i] = hy * s * HS;
    hrt.z[i] = randn() * (edge ? 0.6 : 2.2);
    hrt.edge[i] = edge ? 1 : 0; hrt.ph[i] = rand(TAU);
  }

  // 3c) Columna de luz que sube hacia el corazón
  const NB = 160;
  const beam = Array.from({ length: NB }, () => ({ a: rand(TAU), r: rand(0.2, 1.6), t: Math.random(), sp: rand(0.15, 0.4) }));

  // 3d) Estrellas de fondo
  const NS = 700;
  const stars = Array.from({ length: NS }, () => {
    const u = rand(TAU), v = rand(-1, 1), q = Math.sqrt(1 - v * v), rr = rand(160, 320);
    return { x: q * Math.cos(u) * rr, y: v * rr, z: q * Math.sin(u) * rr, ph: rand(TAU), s: rand(0.6, 1.6) };
  });

  // ---------- 4) Elementos flotantes ----------
  // Personajes (imágenes) que orbitan y se pueden tocar
  const sprites = CFG.cards.map((c, i) => {
    const img = new Image(); img.src = c.img;
    return {
      card: c, img, ang: (i / CFG.cards.length) * TAU, rad: 16 + (i % 3) * 7,
      spd: 0.12 + (i % 2) * 0.05, h: 4 + (i % 3) * 2.2, size: 7, hover: 0, box: null, ph: rand(TAU)
    };
  });

  // Corazoncitos rojos flotantes
  const hearts = Array.from({ length: 16 }, () => ({
    ang: rand(TAU), rad: rand(10, 42), spd: rand(0.05, 0.16) * (Math.random() < 0.5 ? -1 : 1),
    h: rand(1, 7), sz: rand(0.9, 1.7), ph: rand(TAU)
  }));

  // Frases en anillos
  const words = CFG.phrases.map((t, i) => {
    const ring = i % 2;
    return { t, ang: (i / CFG.phrases.length) * TAU, rad: 27 + ring * 9, spd: 0.045 * (ring ? -1 : 1), h: 0.6 + ring * 1.4 };
  });

  let state = "intro";         
  let t0 = 0;                   
  let last = performance.now();
  let time = 0;
  const INTRO_T = 5.0;  

  function drawGlow(x, y, r, c0, c1) {
    const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, c0); gr.addColorStop(1, c1);
    ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  function heartPath(c, s) {
    c.beginPath();
    c.moveTo(0, s * 0.35);
    c.bezierCurveTo(-s * 1.1, -s * 0.35, -s * 0.55, -s * 1.1, 0, -s * 0.5);
    c.bezierCurveTo(s * 0.55, -s * 1.1, s * 1.1, -s * 0.35, 0, s * 0.35);
    c.closePath();
  }

  function render(dt) {
    time += dt;
    // Suavizado de cámara
    if (!drag.on && state !== "intro" && !modalOpen) cam.tYaw += dt * 0.07;
    if (state === "intro") cam.tYaw += dt * 0.03;
    cam.yaw += (cam.tYaw - cam.yaw) * Math.min(1, dt * 6);
    cam.pitch += (cam.tPitch - cam.pitch) * Math.min(1, dt * 6);
    cam.dist += (cam.tDist - cam.dist) * Math.min(1, dt * 6);

    const e = state === "intro" ? 0 : clamp((performance.now() / 1000 - t0) / INTRO_T, 0, 1);
    if (e >= 1 && state === "entering") { state = "live"; }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#050005"; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    // Estrellas
    for (let i = 0; i < NS; i++) {
      const s = stars[i]; project(s.x, s.y, s.z);
      if (P.s <= 0 || P.d < 8) continue;
      const a = 0.35 + 0.35 * Math.sin(time * 1.5 + s.ph);
      ctx.fillStyle = `rgba(255,225,240,${a.toFixed(2)})`;
      ctx.fillRect(P.x, P.y, s.s, s.s);
    }

    // Galaxia (con la explosión inicial: sale del centro y se asienta en espiral)
    const burstR = 70;
    for (let i = 0; i < NG; i++) {
      const ee = clamp((e - g.delay[i]) / (1 - g.delay[i]), 0, 1);
      const ang = g.a0[i] + g.w[i] * time;
      const gx = Math.cos(ang) * g.r[i], gz = Math.sin(ang) * g.r[i], gy = g.y[i];
      let x, y, z;
      if (state === "intro") { x = y = z = 0; }
      else if (ee < 0.4) {
        const k = easeOut(ee / 0.4) * burstR;
        x = g.dx[i] * k; y = g.dy[i] * k; z = g.dz[i] * k;
      } else {
        const k = easeOut((ee - 0.4) / 0.6);
        x = lerp(g.dx[i] * burstR, gx, k); y = lerp(g.dy[i] * burstR, gy, k); z = lerp(g.dz[i] * burstR, gz, k);
      }
      project(x, y, z);
      if (P.s <= 0) continue;
      const sz = g.sz[i] * P.s * 0.13 + 0.5;
      ctx.fillStyle = g.col[i];
      ctx.fillRect(P.x - sz / 2, P.y - sz / 2, sz, sz);
    }

    if (state === "intro") { flush(); return; }

    // Agujero negro + resplandor del núcleo
    const gl = clamp((e - 0.5) / 0.4, 0, 1);
    if (gl > 0) {
      project(0, 0, 0); const c = { x: P.x, y: P.y, s: P.s };
      const flat = Math.sin(cam.pitch);
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, flat);
      drawGlow(0, 0, 9 * c.s * gl, "rgba(255,120,200,0.85)", "rgba(255,40,140,0)");
      ctx.restore();
      ctx.save(); ctx.globalCompositeOperation = "source-over";
      ctx.translate(c.x, c.y); ctx.scale(1, flat);
      ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(0, 0, 2.0 * c.s * gl, 0, TAU); ctx.fill();
      ctx.strokeStyle = `rgba(255,200,235,${0.9 * gl})`; ctx.lineWidth = Math.max(1, 0.35 * c.s);
      ctx.shadowColor = "#ff4fb0"; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(0, 0, 2.2 * c.s * gl, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    // Corazón de partículas (late y rota)
    const hk = easeOut((e - 0.55) / 0.45);
    if (hk > 0) {
      const beat = 1 + 0.05 * Math.pow(Math.max(0, Math.sin(time * 3.2)), 6) * 4;
      const ry = time * 0.6, cr = Math.cos(ry), sr = Math.sin(ry);
      const bob = Math.sin(time * 1.2) * 0.8;
      for (let i = 0; i < NH; i++) {
        const lx = hrt.x[i] * beat * hk, ly = hrt.y[i] * beat * hk, lz = hrt.z[i] * hk;
        project(lx * cr - lz * sr, ly + HY * hk + bob, lx * sr + lz * cr);
        if (P.s <= 0) continue;
        const tw = 0.6 + 0.4 * Math.sin(time * 4 + hrt.ph[i]);
        const sz = (hrt.edge[i] ? 1.5 : 1.1) * P.s * 0.1 + 0.4;
        ctx.fillStyle = hrt.edge[i] ? `rgba(255,140,210,${(0.95 * tw).toFixed(2)})` : `rgba(255,50,120,${(0.75 * tw).toFixed(2)})`;
        ctx.fillRect(P.x - sz / 2, P.y - sz / 2, sz, sz);
      }
      // resplandor detrás del corazón
      project(0, HY * hk + bob, 0);
      drawGlow(P.x, P.y, 14 * P.s, "rgba(255,60,150,0.22)", "rgba(255,60,150,0)");
      // columna de luz
      for (let i = 0; i < NB; i++) {
        const b = beam[i]; b.t += b.sp * dt; if (b.t > 1) b.t -= 1;
        const yy = b.t * (HY - 8) * hk, rr = b.r * (1 - b.t * 0.7);
        project(Math.cos(b.a + time) * rr, yy, Math.sin(b.a + time) * rr);
        ctx.fillStyle = `rgba(255,190,230,${(0.8 * (1 - b.t)).toFixed(2)})`;
        ctx.fillRect(P.x, P.y, 1.4, 1.4);
      }
    }

    // ----- Elementos con orden de profundidad (frases, personajes, corazones) -----
    const items = [];
    const vis = clamp((e - 0.75) / 0.25, 0, 1);
    if (vis > 0) {
      for (const w of words) { w.ang += w.spd * dt; project(Math.sin(w.ang) * w.rad, w.h, Math.cos(w.ang) * w.rad); items.push({ d: P.d, k: 0, o: w }); }
      for (const s of sprites) { s.ang += s.spd * dt * (modalOpen ? 0.2 : 1); project(Math.sin(s.ang) * s.rad, s.h + Math.sin(time * 1.4 + s.ph) * 0.8, Math.cos(s.ang) * s.rad); items.push({ d: P.d, k: 1, o: s }); }
      for (const h of hearts) { h.ang += h.spd * dt; project(Math.sin(h.ang) * h.rad, h.h + Math.sin(time * 2 + h.ph) * 1.2, Math.cos(h.ang) * h.rad); items.push({ d: P.d, k: 2, o: h }); }
    }
    items.sort((a, b) => b.d - a.d);
    ctx.globalCompositeOperation = "source-over";
    for (const it of items) {
      if (it.k === 0) drawWord(it.o, vis);
      else if (it.k === 1) drawSprite(it.o, vis, dt);
      else drawHeart(it.o, vis);
    }
    flush();
  }

  function flush() { ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; }

  // Texto que "yace" sobre el disco: transformación afín obtenida de la proyección
  const A0 = { x: 0, y: 0, d: 1, s: 1 }, A1 = { x: 0, y: 0, d: 1, s: 1 }, A2 = { x: 0, y: 0, d: 1, s: 1 };
  function drawWord(w, vis) {
    const px = Math.sin(w.ang) * w.rad, pz = Math.cos(w.ang) * w.rad;
    const tx = Math.cos(w.ang), tz = -Math.sin(w.ang);      // tangente
    const ux = -Math.sin(w.ang), uz = -Math.cos(w.ang);     // "arriba" del texto = hacia el centro
    const u = 0.1;
    project(px, w.h, pz, A0); if (A0.s <= 0) return;
    project(px + tx * u, w.h, pz + tz * u, A1);
    project(px - ux * u, w.h, pz - uz * u, A2);
    const alpha = clamp((A0.s * 40 - 8) / 30, 0.25, 1) * vis;
    ctx.save();
    ctx.setTransform((A1.x - A0.x) * DPR, (A1.y - A0.y) * DPR, (A2.x - A0.x) * DPR, (A2.y - A0.y) * DPR, A0.x * DPR, A0.y * DPR);
    ctx.font = "700 15px 'Courier New', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.strokeStyle = `rgba(255,60,160,${0.35 * alpha})`; ctx.lineWidth = 4; ctx.strokeText(w.t, 0, 0);
    ctx.fillStyle = `rgba(255,200,230,${alpha})`; ctx.fillText(w.t, 0, 0);
    ctx.restore();
  }

  function drawSprite(s, vis, dt) {
    project(Math.sin(s.ang) * s.rad, s.h + Math.sin(time * 1.4 + s.ph) * 0.8, Math.cos(s.ang) * s.rad);
    if (P.s <= 0) { s.box = null; return; }
    s.hover += ((s.isHover ? 1 : 0) - s.hover) * Math.min(1, dt * 10);
    const pulse = 1 + 0.04 * Math.sin(time * 3 + s.ph);
    const r = s.size * P.s * pulse * (1 + 0.18 * s.hover) * 0.5 * vis;
    const x = P.x, y = P.y;
    s.box = { x, y, r: Math.max(r, 14) };
    ctx.save();
    ctx.globalAlpha = vis;
    // halo
    drawGlow(x, y, r * 2.1, "rgba(255,90,170,0.45)", "rgba(255,90,170,0)");
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.closePath();
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.save(); ctx.clip();
    if (s.img.complete && s.img.naturalWidth) ctx.drawImage(s.img, x - r, y - r, r * 2, r * 2);
    ctx.restore();
    ctx.strokeStyle = "#ff6fb5"; ctx.lineWidth = Math.max(1.5, r * 0.09);
    ctx.shadowColor = "#ff4fa3"; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function drawHeart(h, vis) {
    project(Math.sin(h.ang) * h.rad, h.h + Math.sin(time * 2 + h.ph) * 1.2, Math.cos(h.ang) * h.rad);
    if (P.s <= 0) return;
    const s = h.sz * P.s * 0.55 * (1 + 0.12 * Math.sin(time * 4 + h.ph));
    ctx.save(); ctx.globalAlpha = 0.9 * vis; ctx.translate(P.x, P.y);
    drawGlow(0, 0, s * 2.4, "rgba(255,40,70,0.5)", "rgba(255,40,70,0)");
    heartPath(ctx, s); ctx.fillStyle = "#ff3b4e"; ctx.shadowColor = "#ff2a55"; ctx.shadowBlur = 12; ctx.fill();
    ctx.restore();
  }

  // ---------- 6) Interacción ----------
  const drag = { on: false, moved: 0, x: 0, y: 0, id: null };
  const pts = new Map();
  let pinch0 = 0, dist0 = 0;

  function pick(x, y) {
    let best = null;
    for (const s of sprites) if (s.box) {
      const dx = x - s.box.x, dy = y - s.box.y;
      if (dx * dx + dy * dy <= s.box.r * s.box.r) best = s;   // el último dibujado = el más cercano
    }
    return best;
  }

  canvas.addEventListener("pointerdown", ev => {
    canvas.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = cam.tDist; }
    drag.on = true; drag.moved = 0; drag.x = ev.clientX; drag.y = ev.clientY;
    canvas.classList.add("dragging");
  });
  canvas.addEventListener("pointermove", ev => {
    if (pts.has(ev.pointerId)) pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      cam.tDist = clamp(dist0 * pinch0 / Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)), 45, 170);
      return;
    }
    if (drag.on) {
      const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = ev.clientX; drag.y = ev.clientY;
      cam.tYaw += dx * 0.006; cam.tPitch = clamp(cam.tPitch + dy * 0.004, 0.08, 1.3);
    } else {
      const h = state === "live" ? pick(ev.clientX, ev.clientY) : null;
      sprites.forEach(s => (s.isHover = s === h));
      canvas.classList.toggle("pointer", !!h);
    }
  });
  const end = ev => {
    pts.delete(ev.pointerId);
    if (drag.on && drag.moved < 6 && state !== "intro" && pts.size === 0) {
      const s = pick(ev.clientX, ev.clientY); if (s) openModal(s.card);
    }
    drag.on = pts.size > 0; canvas.classList.remove("dragging");
  };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  canvas.addEventListener("wheel", ev => {
    ev.preventDefault(); cam.tDist = clamp(cam.tDist * (1 + ev.deltaY * 0.001), 45, 170);
  }, { passive: false });

  // ---------- 7) Interfaz (intro y tarjetas) ----------
  const $ = id => document.getElementById(id);
  const intro = $("intro"), modal = $("modal"), hint = $("hint");
  const music = $("backgroundMusic"), musicPlayer = $("musicPlayer");
  const musicToggle = $("musicToggle"), musicSeek = $("musicSeek");
  const musicCurrent = $("musicCurrent"), musicDuration = $("musicDuration");
  let modalOpen = false;

  $("introTitle").textContent = CFG.intro.title;
  $("introImg").src = CFG.intro.image;
  $("introSub").textContent = CFG.intro.subtitle;
  $("enterBtn").textContent = CFG.intro.button;
  hint.textContent = CFG.hint;

  $("lockForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const correctDate = $("lockDay").value.trim() === "13"
      && $("lockMonth").value.trim() === "10"
      && $("lockYear").value.trim() === "2026";
    $("lockError").hidden = correctDate;
    if (correctDate) {
      $("lockScreen").classList.add("unlocked");
      musicPlayer.classList.add("show");
      playMusic();
    }
  });

  $("enterBtn").addEventListener("click", () => {
    intro.classList.add("hide");
    state = "entering"; t0 = performance.now() / 1000;
    hint.classList.add("show");
  });

  function playMusic() {
    music.play().catch(() => {
      window.alert("No se pudo reproducir la canción. Verifica que exista cancion.mp3/cancion.mp3 junto a index.html.");
    });
  }

  function formatTime(seconds) {
    const total = Math.floor(seconds);
    const minutes = Math.floor(total / 60);
    return `${minutes}:${String(total % 60).padStart(2, "0")}`;
  }

  function updateMusicDuration() {
    if (!Number.isFinite(music.duration)) return;
    musicSeek.max = String(Math.floor(music.duration));
    musicSeek.disabled = false;
    musicDuration.textContent = formatTime(music.duration);
  }

  music.addEventListener("loadedmetadata", updateMusicDuration);
  music.addEventListener("durationchange", updateMusicDuration);
  music.addEventListener("timeupdate", () => {
    musicSeek.value = String(Math.floor(music.currentTime));
    musicCurrent.textContent = formatTime(music.currentTime);
  });
  music.addEventListener("play", () => {
    musicToggle.textContent = "❚❚";
    musicToggle.setAttribute("aria-label", "Pausar canción");
  });
  music.addEventListener("pause", () => {
    musicToggle.textContent = "▶";
    musicToggle.setAttribute("aria-label", "Reproducir canción");
  });
  music.addEventListener("ended", () => {
    musicToggle.textContent = "▶";
    musicToggle.setAttribute("aria-label", "Reproducir canción");
  });
  musicToggle.addEventListener("click", () => {
    if (music.paused) playMusic();
    else music.pause();
  });
  musicSeek.addEventListener("input", () => {
    if (!Number.isFinite(music.duration)) return;
    music.currentTime = Number(musicSeek.value);
    musicCurrent.textContent = formatTime(music.currentTime);
  });

  function openModal(c) {
    $("modalImg").src = c.img; $("modalTitle").textContent = c.title; $("modalText").textContent = c.text;
    modal.classList.add("open"); modal.setAttribute("aria-hidden", "false"); modalOpen = true;
  }
  function closeModal() { modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true"); modalOpen = false; }
  $("modalClose").addEventListener("click", closeModal);
  modal.addEventListener("click", ev => { if (ev.target === modal) closeModal(); });
  window.addEventListener("keydown", ev => { if (ev.key === "Escape") closeModal(); });

  // ---------- Bucle principal ----------
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    render(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Gancho para pruebas automáticas
  window.__galaxia = { cam, sprites, get state() { return state; }, openModal };
})();

</script>
</body>
</html>
